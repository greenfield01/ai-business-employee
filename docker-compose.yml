services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: ai_business_employee_postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ai_business_employee
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app_dev_password

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: ai_business_employee_redis
    restart: unless-stopped

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
